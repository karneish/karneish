name: Update Profile

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Timestamp
        uses: nick-fields/replace@v3
        with:
          filename: 'README.md'
          regex: 'Last Updated:.*'
          replace: 'Last Updated: 2026-08-25 13:59:45 UTC'

      - name: Commit changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update profile [skip ci]"
          git push