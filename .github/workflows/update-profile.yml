name: Update Profile

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update timestamp
        run: date -u +"%Y-%m-%d %H:%M:%S UTC" > .last-updated

      - name: Commit
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-updated
          git diff --staged --quiet || git commit -m "chore: daily update [skip ci]"
          git push