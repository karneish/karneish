name: Daily Update

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: date -u +"%Y-%m-%d %H:%M:%S UTC" > .last-updated
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-updated
          git diff --staged --quiet || git commit -m "chore: daily update [skip ci]"
          git push